          <title id="map-title">귀, 코, 목 탐험 지도</title>
          <desc id="map-desc">옆에서 본 머리를 지도처럼 그렸습니다. 귀로 들어온 소리가 달팽이관까지 가는 길, 콧구멍으로 들어온 숨이 비강과 목을 지나 기관으로 내려가는 길, 성대에서 난 목소리가 입으로 나오는 길이 표시되어 있습니다.</desc>
